# Builds the site from content/*.json and publishes it to GitHub Pages on every push to main
# (including saves from the control panel at /admin/).
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) build the site and upload it
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the image tool for share images
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node scripts/build.mjs
      - name: Collect the public files
        run: rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' --exclude 'content' --exclude 'node_modules' --exclude '*.md' --exclude '.gitignore' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 2) publish it, in a job of its own: the upload is fully registered by the time this starts
  #    (in one job, GitHub sometimes could not find the file it had just uploaded)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
